# ─────────────────────────────────────────────────────────────
#  SwizzSMP — main config
#  Balance numbers for each swizz live in abilities.yml.
#  Item looks and crafting recipes live in items.yml.
#  Run /swizzadmin reload after editing.
# ─────────────────────────────────────────────────────────────

# Used to update older config files automatically. Don't change it.
config-version: 3

energy:
  start: 2            # energy a brand-new player has
  min: 1              # you can never go below this
  max: 5              # killing someone at max drops their energy as an item
  # The killer only gains energy if the victim actually lost one.
  # Stops farming players who are already at the minimum.
  kill-requires-victim-loss: true

cooldowns:
  min-seconds: 10                 # no ability cooldown can go below this
  slot-bonus-multiplier: 0.75     # energy tier 2 / tier 4 bonus (-25%)
  upgraded-multiplier: 0.75       # upgraded swizz (-25%)
  ready-notification: true        # ding + message when an ability is ready again

loadout:
  switch-cooldown-seconds: 30     # how often /loadout can be changed

abilities:
  # How long "next hit" abilities (Confusion scramble, Frost freeze) stay armed.
  arm-window-seconds: 30
  # Worlds where swizz abilities can't be used (passives still work).
  disabled-worlds: []
  # Ignore repeat activations faster than this (stops double key presses).
  activation-debounce-ms: 250
  # true  = ability damage ignores armor and Protection ("3 hearts" means 3 hearts).
  #         Resistance and absorption still reduce it.
  # false = vanilla armor and enchantments reduce ability damage.
  true-damage: true

controls:
  # Sneak + F (swap hands) = ability 1, Sneak + Q (drop) = ability 2.
  # Sneak + Q needs an item in hand: Minecraft sends no drop action for an empty hand.
  # Players can toggle this for themselves with /swizz controls.
  default-enabled: true

low-health:
  # Red flashing screen edges + heartbeat sound when you are about to die.
  # The red edges need Fancy or Fabulous graphics on the player's client.
  # Players can turn it off for themselves with /swizz heartbeat.
  enabled: true
  threshold-hearts: 4        # starts at or below this many hearts
  slow-beat-ticks: 24        # time between beats at the threshold (20 ticks = 1 second)
  fast-beat-ticks: 9         # time between beats at half a heart
  flash-ticks: 6             # how long the red stays on per beat
  volume: 1.0

resource-pack:
  # Custom item textures. The plugin downloads the zip once at startup to learn its
  # SHA-1, then sends it to every player who joins. To update the textures, replace the
  # zip at the URL and run /swizzadmin reload (or restart).
  enabled: true
  url: "https://raw.githubusercontent.com/skilledseeker/SwizzSMP/main/resourcepack/SwizzSMP-pack.zip"
  # Optional: set the zip's SHA-1 here to skip the download at startup.
  sha1: ""
  # true = players who decline the pack are kicked. false = they can decline and will
  # see the vanilla look-alike items instead.
  required: false
  prompt: "<gradient:#B05CE0:#3498DB><b>SwizzSMP</b></gradient> <gray>needs its texture pack so the swizz items look right."
  # Keep false so packs from other plugins (kill effects etc.) stay loaded next to ours.
  replace-other-packs: false
  # Ticks after joining before the pack is sent (lets other plugins' packs go first).
  send-delay-ticks: 40

tab-colors:
  # Name colour in the tab list, by the special item a player carries.
  # Priority: dragon egg > swizz sword > swizz mace > upgrader > default.
  enabled: true
  dragon-egg: "#AA00AA"     # purple
  swizz-sword: "#FFFF55"    # yellow
  swizz-mace: "#AA0000"     # dark red
  upgrader: "#FFFFFF"       # white
  default: "#AAAAAA"        # gray

hud:
  # cooldowns = only show ability cooldowns, full = swizz name, energy, all perks
  mode: cooldowns
  enabled-by-default: true
  update-ticks: 10

combo:
  # A combo breaks if this many seconds pass between hits.
  timeout-seconds: 2.5

trust:
  max-trusted: 20

swizz-items:
  # If true, only players without a swizz can craft swizz items.
  craft-requires-no-swizz: false

# Give players a random swizz the first time they join.
assign-random-on-first-join: false

reroller:
  keeps-upgrade: true

ritual:
  duration-minutes: 20
  leak-interval-minutes: 5
  # Y is always leaked at the start. These leak one by one after that.
  leak-order: [X, Z]
  # The owner must be within this many blocks of the ritual when it ends.
  radius: 5
  # Rituals only work within this many blocks of the world spawn (x and z),
  # in every dimension.
  max-distance-from-spawn: 1500
  # Players must right-click twice within this many seconds to start a ritual.
  confirm-seconds: 5

dragon-egg:
  # Right-click air with the dragon egg: scramble everyone else's swizz.
  enabled: true
  duration-minutes: 5
  cooldown-minutes: 30
  exclude-user: true
  # Sneak + right-click air with the dragon egg: only you see the locator bar.
  locator:
    enabled: true
    duration-minutes: 30
    cooldown-hours: 12
    # Hide the locator bar for everyone who isn't using the dragon egg tracker.
    hide-for-everyone-else: true

swizz-mace:
  disable-seconds: 60
  cooldown-seconds: 180

storage:
  autosave-minutes: 5
